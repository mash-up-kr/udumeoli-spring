plugins {
	id 'org.jetbrains.kotlin.jvm' version '1.9.25'
	id 'org.jetbrains.kotlin.plugin.spring' version '1.9.25'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.graalvm.buildtools.native' version '0.10.6'

	id 'org.jlleitschuh.gradle.ktlint' version '12.1.1'
	id 'io.gitlab.arturbosch.detekt' version '1.23.6'
}

group = 'udumeoli'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-graphql'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	implementation 'org.jetbrains.kotlin:kotlin-reflect'
	runtimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
	testImplementation 'org.springframework.graphql:spring-graphql-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Flyway (스키마 마이그레이션, ADR-1)
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-database-oracle'

	// Object Storage — OCI Object Storage의 S3 호환 API에 붙는 클라이언트 (이미지 파이프라인 D1)
	// netty/apache 클라이언트를 빼고 JDK 기반 url-connection-client만 사용 — Native Image 호환 + 1GB RAM footprint
	implementation platform('software.amazon.awssdk:bom:2.29.9')
	implementation('software.amazon.awssdk:s3') {
		exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
		exclude group: 'software.amazon.awssdk', module: 'apache-client'
	}
	implementation 'software.amazon.awssdk:url-connection-client'

	// Oracle JDBC (운영용)
	implementation platform('com.oracle.database.jdbc:ojdbc-bom:21.14.0.0')
	runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
	runtimeOnly 'com.oracle.database.security:oraclepki'
	runtimeOnly 'com.oracle.database.security:osdt_core'
	runtimeOnly 'com.oracle.database.security:osdt_cert'

	// Google ID Token 검증
	// NetHttpTransport를 사용하므로 Apache HTTP 전송 계층은 필요 없다.
	// 함께 들어오는 commons-logging은 spring-jcl과 동일한 클래스를 제공해 Native Image 초기화를 충돌시킨다.
	implementation('com.google.api-client:google-api-client:2.2.0') {
		exclude group: 'com.google.http-client', module: 'google-http-client-apache-v2'
		exclude group: 'org.apache.httpcomponents', module: 'httpclient'
		exclude group: 'org.apache.httpcomponents', module: 'httpcore'
		exclude group: 'commons-logging', module: 'commons-logging'
	}

	// Remote Config 서버 조건/비율 평가. 사용하지 않는 Cloud 서비스는 제외한다.
	implementation('com.google.firebase:firebase-admin:9.11.0') {
		exclude group: 'com.google.cloud', module: 'google-cloud-firestore'
		exclude group: 'com.google.cloud', module: 'google-cloud-storage'
		exclude group: 'commons-logging', module: 'commons-logging'
		exclude group: 'org.apache.httpcomponents', module: 'httpclient'
		exclude group: 'com.google.http-client', module: 'google-http-client-apache-v2'
	}
	// Firebase Remote Config는 내부적으로 JacksonFactory를 사용한다.
	implementation 'com.google.http-client:google-http-client-jackson2:2.2.0'

	// JWT 파싱 및 검증 (Apple Identity Token)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	testImplementation 'io.mockk:mockk:1.13.13'
}

kotlin {
	compilerOptions {
		freeCompilerArgs.addAll '-Xjsr305=strict'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

// ktlint 설정
ktlint {
	version = "1.3.1"
	verbose = true
	outputToConsole = true
}

// detekt 설정
detekt {
	buildUponDefaultConfig = true
	autoCorrect = false
	config.setFrom("$projectDir/detekt.yml")
}

// detekt configuration의 Kotlin 의존성을 detekt가 컴파일된 버전(1.9.23)으로 강제
// 프로젝트 코드는 그대로 Kotlin 1.9.25를 사용하지만, detekt가 자기 자신을 실행할 때는
// 컴파일 시점 버전과 맞춰야 NoSuchMethodError 등의 런타임 충돌을 피할 수 있음
configurations.matching { it.name == "detekt" }.all {
	resolutionStrategy.eachDependency { details ->
		if (details.requested.group == 'org.jetbrains.kotlin') {
			details.useVersion('1.9.23')
		}
	}
}

graalvmNative {
	binaries {
		main {
			imageName = 'udumeoli'
		}
		test {
			// Kotlin 1.9의 테스트 메타데이터가 참조하는 불변 enum. 테스트 이미지에만 적용한다.
			buildArgs.add('--initialize-at-build-time=kotlin.annotation.AnnotationRetention,kotlin.annotation.AnnotationTarget')
		}
	}
}
