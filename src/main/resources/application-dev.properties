# Datasource (스키마는 Flyway가 관리)
spring.datasource.url=jdbc:oracle:thin:@udumeolidb2_medium?TNS_ADMIN=/opt/oracle/wallet
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=APP_USER
spring.datasource.password=${DB_PASSWORD}

# Authentication secrets must be supplied by the deployment environment.
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
auth.jwt.secret=${JWT_SECRET}

# OAuth login result destination
auth.frontend-callback-url=${FRONTEND_LOGIN_CALLBACK_URL:https://udumeoli-web.vercel.app/login/callback}

# PKCS12 wallet (GraalVM Native 호환)
javax.net.ssl.trustStore=/opt/oracle/wallet/truststore.jks
javax.net.ssl.trustStorePassword=${WALLET_PASSWORD}
javax.net.ssl.keyStore=/opt/oracle/wallet/keystore.jks
javax.net.ssl.keyStorePassword=${WALLET_PASSWORD}
