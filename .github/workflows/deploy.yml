name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:   # Actions UI에서 브랜치 골라 수동 배포 (dev 검증용 / JIT-AOT 벤치마크용)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Record build start
        id: build_start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build native Docker image
        run: |
          docker build \
            -t udumeoli-backend:${{ github.sha }} \
            -t udumeoli-backend:latest \
            .

      - name: Record build end & image size
        id: build_end
        run: |
          echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "size=$(docker images udumeoli-backend:latest --format '{{.Size}}')" >> "$GITHUB_OUTPUT"

      - name: Save image
        run: docker save udumeoli-backend:latest | gzip > image.tar.gz

      - name: Check image size
        run: ls -lh image.tar.gz

      - name: Record transfer start
        id: transfer_start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Copy image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "image.tar.gz"
          target: "/home/deploy/"

      - name: Record transfer end
        id: transfer_end
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      # compose 파일을 리포 기준으로 덮어써 서버 수동 편집과의 드리프트를 막는다.
      # 비밀값은 서버의 /home/deploy/app/.env 에만 있고 여기서 건드리지 않는다 (.env는 gitignore).
      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/home/deploy/app/"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /home/deploy
            docker load < image.tar.gz

            cd /home/deploy/app
            docker compose down
            docker compose up -d

            rm /home/deploy/image.tar.gz
            docker image prune -f

            echo "Deploy complete: ${{ github.sha }}"

      # JIT-AOT 벤치마크용 지표 수집. 측정 후 이 브랜치는 삭제 예정이라 임시로 여기 둠.
      - name: Measure startup & runtime metrics
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            RESULT=/home/deploy/bench-result-aot.txt
            echo "=== bench-aot run $(date -u +%FT%TZ) (sha ${{ github.sha }}) ===" > "$RESULT"

            # time-to-ready: 헬스체크 폴링
            START=$(date +%s)
            until curl -sf http://localhost:8080/actuator/health > /dev/null; do sleep 1; done
            END=$(date +%s)
            echo "time_to_ready_sec=$((END-START))" >> "$RESULT"

            # Spring Boot 자체 기동시간 로그
            docker logs udumeoli-app 2>&1 | grep -E "Started .* in [0-9.]+ seconds" >> "$RESULT" || echo "started_log=NOT_FOUND" >> "$RESULT"

            # RSS: 기동 직후
            echo "rss_startup=$(docker stats --no-stream --format '{{.MemUsage}}' udumeoli-app)" >> "$RESULT"

            # 콜드 요청 응답시간
            cold=$(curl -s -o /dev/null -w "%{time_total}" http://localhost:8080/actuator/health)
            echo "cold_request_sec=$cold" >> "$RESULT"

            # 워밍업 (JIT 브랜치와 동일한 반복 횟수로 맞춰서 공정하게 비교)
            for i in $(seq 1 1000); do
              curl -s -o /dev/null http://localhost:8080/actuator/health
            done

            # 웜 요청 응답시간
            warm=$(curl -s -o /dev/null -w "%{time_total}" http://localhost:8080/actuator/health)
            echo "warm_request_sec=$warm" >> "$RESULT"

            # RSS: 워밍업 후 steady-state
            echo "rss_after_warmup=$(docker stats --no-stream --format '{{.MemUsage}}' udumeoli-app)" >> "$RESULT"

            echo "--- bench-result-aot.txt ---"
            cat "$RESULT"

      - name: Report build/transfer metrics
        run: |
          {
            echo "## 벤치마크 결과 (bench-aot / sha ${{ github.sha }})"
            echo ""
            echo "| 지표 | 값 |"
            echo "|---|---|"
            echo "| 빌드 시간(초) | $(( ${{ steps.build_end.outputs.epoch }} - ${{ steps.build_start.outputs.epoch }} )) |"
            echo "| 이미지 크기 | ${{ steps.build_end.outputs.size }} |"
            echo "| 이미지 전송 시간(초) | $(( ${{ steps.transfer_end.outputs.epoch }} - ${{ steps.transfer_start.outputs.epoch }} )) |"
            echo ""
            echo "나머지 지표(time-to-ready, 기동로그, RSS, 콜드/웜 응답시간)는 위 'Measure startup & runtime metrics' 스텝 로그 참고 (서버의 /home/deploy/bench-result-aot.txt 에도 저장됨)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
