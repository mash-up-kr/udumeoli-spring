services:
  app:
    image: udumeoli-backend:latest
    container_name: udumeoli-app
    restart: unless-stopped
    ports:
      # nginx 리버스 프록시만 접근하도록 로컬에만 바인딩
      - "127.0.0.1:8080:8080"
    environment:
      # ★ 이게 빠지면 Oracle(dev) 설정이 로드 안 되고 H2로 폴백됨
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: dev
      # 비밀번호는 같은 폴더의 .env 에서 주입 (git 에는 커밋 금지)
      DB_PASSWORD: ${DB_PASSWORD}
      WALLET_PASSWORD: ${WALLET_PASSWORD}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_LOGIN_CALLBACK_URL: ${FRONTEND_LOGIN_CALLBACK_URL}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_REGION: ${STORAGE_REGION}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL}
      THUMBNAIL_SERVER_URL: ${THUMBNAIL_SERVER_URL}
      KMS_MASTER_KEY: ${KMS_MASTER_KEY}
      API_BASE_URL: ${API_BASE_URL}
      # ATP의 APP_USER 스키마에는 삭제할 수 없는 고아 identity 시퀀스(ISEQ$$_...)가 남아 있다.
      # 소유 테이블이 이미 드롭돼 ORA-32794(cannot drop a system-generated sequence)로 제거가 막히는데,
      # 이것들 때문에 Flyway가 스키마를 영구히 "비어있지 않음"으로 판정해 V1을 시작조차 못 한다.
      # baseline으로 이력 테이블을 만들어 그 검사를 통과시킨다.
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      # 반드시 0이어야 한다. 기본값 1이면 V1이 "이미 적용됨"으로 건너뛰어져 스키마가 통째로 비어버린다.
      SPRING_FLYWAY_BASELINE_VERSION: "0"
    volumes:
      # 서버의 wallet 디렉토리를 컨테이너 안으로 read-only 마운트
      - /opt/oracle/wallet:/opt/oracle/wallet:ro
    # 참고: runtime 이미지(debian-slim)에 curl 이 없어서 compose healthcheck 는 생략.
    #       헬스체크는 deploy.yml 이 nginx 경유로 외부에서 수행함.
