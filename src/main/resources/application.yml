spring:
  application:
    name: TripPhoto
  graphql:
    graphiql:
      enabled: true
  http:
    client:
      connect-timeout: 2s
      read-timeout: 5s
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: "${KAKAO_CLIENT_ID:local-kakao-client-id}"
            client-secret: "${KAKAO_CLIENT_SECRET:local-kakao-client-secret}"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

storage:
  endpoint: "${STORAGE_ENDPOINT:http://localhost:9000}"
  region: "${STORAGE_REGION:us-east-1}"
  bucket: "${STORAGE_BUCKET:photato-image}"
  access-key: "${STORAGE_ACCESS_KEY:local}"
  secret-key: "${STORAGE_SECRET_KEY:local}"
  public-base-url: "${STORAGE_PUBLIC_BASE_URL:http://localhost:9000/photato-image}"

thumbnail:
  server-url: "${THUMBNAIL_SERVER_URL:}"

max-upload-size: 10MB

auth:
  jwt:
    issuer: udumeoli
    secret: "${JWT_SECRET:local-development-jwt-secret-change-before-deploying}"
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    signup-token-ttl: 10m
  oauth-login-code-ttl: 2m
  frontend-callback-url: "${FRONTEND_LOGIN_CALLBACK_URL:http://localhost:3000/login/callback}"
  cors-allowed-origins:
    - http://localhost:3000
    - https://udumeoli-web.vercel.app
