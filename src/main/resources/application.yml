spring:
  application:
    name: TripPhoto
  graphql:
    graphiql:
      enabled: true
  http:
    client:
      connect-timeout: 2s
      read-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health

storage:
  endpoint: "${STORAGE_ENDPOINT:http://localhost:9000}"
  region: "${STORAGE_REGION:us-east-1}"
  bucket: "${STORAGE_BUCKET:photato-image}"
  access-key: "${STORAGE_ACCESS_KEY:local}"
  secret-key: "${STORAGE_SECRET_KEY:local}"
  public-base-url: "${STORAGE_PUBLIC_BASE_URL:http://localhost:9000/photato-image}"
thumbnail:
  server-url: "${THUMBNAIL_SERVER_URL:}"

max-upload-size: 10MB