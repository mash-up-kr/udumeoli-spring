name: Bench Recheck

on:
  workflow_dispatch:

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - name: Re-grep Spring Boot startup log on running container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker logs udumeoli-app 2>&1 | grep -E "Started .* in [0-9.]+ seconds"
