spring:
  datasource:
    # _medium/_high는 리포팅/배치용 서비스로 세션 병렬 DML이 기본 켜져 있어,
    # 한 트랜잭션에서 같은 테이블을 두 번 이상 DELETE/UPDATE하면 ORA-12839가 난다.
    # 이 앱처럼 트랜잭션형 CRUD 워크로드는 병렬 DML이 꺼져 있는 _tp(Transaction Processing) 서비스를 써야 한다.
    url: "jdbc:oracle:thin:@udumeolidb2_tp?TNS_ADMIN=/opt/oracle/wallet"
    driver-class-name: oracle.jdbc.OracleDriver
    username: APP_USER
    password: "${DB_PASSWORD}"
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: "${KAKAO_CLIENT_ID}"
            client-secret: "${KAKAO_CLIENT_SECRET}"

javax:
  net:
    ssl:
      trustStore: /opt/oracle/wallet/truststore.jks
      trustStorePassword: "${WALLET_PASSWORD}"
      keyStore: /opt/oracle/wallet/keystore.jks
      keyStorePassword: "${WALLET_PASSWORD}"

storage:
  endpoint: "${STORAGE_ENDPOINT}"
  region: "${STORAGE_REGION}"
  bucket: "${STORAGE_BUCKET}"
  access-key: "${STORAGE_ACCESS_KEY}"
  secret-key: "${STORAGE_SECRET_KEY}"
  public-base-url: "${STORAGE_PUBLIC_BASE_URL}"

auth:
  jwt:
    secret: "${JWT_SECRET}"
  frontend-callback-url: "${FRONTEND_LOGIN_CALLBACK_URL:https://www.pinnned.co.kr/login/callback}"
